<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SR Password Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #0D0D1A;
  --surface: #13132A;
  --surface2: #1A1A35;
  --border: #2A2A50;
  --accent: #7C3AED;
  --accent2: #A855F7;
  --accent3: #06B6D4;
  --accent4: #10B981;
  --accent5: #F59E0B;
  --accent6: #EF4444;
  --text: #F1F0FF;
  --muted: #6B7280;
  --card-shadow: 0 4px 24px rgba(124,58,237,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* LOCK SCREEN */
.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 30% 20%,rgba(124,58,237,0.15) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(6,182,212,0.1) 0%,transparent 60%),var(--bg);}
.lock-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px 28px;width:100%;max-width:380px;box-shadow:var(--card-shadow);}
.lock-logo{text-align:center;margin-bottom:24px;}
.lock-logo-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;}
.lock-logo h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.lock-logo p{color:var(--muted);font-size:13px;margin-top:4px;}
.user-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--surface2);border-radius:12px;padding:4px;}
.user-tab{flex:1;padding:8px;border:none;background:transparent;color:var(--muted);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;}
.user-tab.active{background:var(--accent);color:#fff;}
.lock-input-wrap{position:relative;margin-bottom:12px;}
.lock-input{width:100%;background:var(--surface2);border:2px solid var(--border);color:var(--text);border-radius:12px;padding:13px 46px 13px 14px;font-size:15px;outline:none;font-family:'Inter',sans-serif;transition:border-color 0.2s;}
.lock-input:focus{border-color:var(--accent);}
.eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity 0.2s;margin-top:4px;}
.btn-primary:hover{opacity:0.9;}
.lock-error{color:#EF4444;font-size:13px;text-align:center;margin-top:8px;min-height:20px;}
.forgot-link{text-align:center;margin-top:12px;}
.forgot-link button{background:none;border:none;color:var(--accent2);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:underline;}

/* RESET MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:340px;}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text);}
.modal-input{width:100%;background:var(--surface2);border:2px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;font-family:'Inter',sans-serif;margin-bottom:10px;}
.modal-input:focus{border-color:var(--accent);}
.modal-btns{display:flex;gap:8px;margin-top:4px;}
.btn-cancel{flex:1;padding:11px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-confirm{flex:1;padding:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
.modal-error{color:#EF4444;font-size:12px;margin-bottom:8px;min-height:16px;}

/* APP */
#app{display:none;min-height:100vh;}
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.app-logo{display:flex;align-items:center;gap:10px;}
.app-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.app-logo span{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-right{display:flex;align-items:center;gap:8px;}
.user-badge{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.icon-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;}

/* MAIN */
.main{padding:16px;max-width:600px;margin:0 auto;}

/* SEARCH BAR */
.search-wrap{position:relative;margin-bottom:16px;}
.search-input{width:100%;background:var(--surface);border:2px solid var(--border);color:var(--text);border-radius:14px;padding:12px 44px 12px 14px;font-size:14px;outline:none;font-family:'Inter',sans-serif;transition:border-color 0.2s;}
.search-input:focus{border-color:var(--accent);}
.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;}
.stat-num{font-size:24px;font-weight:800;font-family:'Space Grotesk',sans-serif;}
.stat-label{font-size:11px;color:var(--muted);margin-top:3px;}

/* CATEGORY FILTER */
.cat-scroll{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-chip{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all 0.2s;font-family:'Inter',sans-serif;}
.cat-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ENTRY CARD */
.entry-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;transition:border-color 0.2s;}
.entry-card:hover{border-color:var(--accent);}
.entry-header{padding:14px 14px 10px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.entry-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.entry-info{flex:1;min-width:0;}
.entry-name{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-username{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-actions{display:flex;gap:6px;}
.action-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 8px;font-size:13px;cursor:pointer;transition:all 0.2s;}
.action-btn:hover{border-color:var(--accent);color:var(--accent);}
.action-btn.danger:hover{border-color:#EF4444;color:#EF4444;}

/* ENTRY DETAIL */
.entry-detail{display:none;padding:0 14px 14px;border-top:1px solid var(--border);margin-top:4px;}
.entry-detail.open{display:block;}
.detail-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.detail-row:last-child{border-bottom:none;}
.detail-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.detail-value{font-size:13px;color:var(--text);font-family:monospace;display:flex;align-items:center;gap:6px;}
.pw-dots{letter-spacing:3px;font-size:16px;}
.copy-btn{background:none;border:none;color:var(--accent2);font-size:13px;cursor:pointer;padding:2px 6px;border-radius:6px;font-family:'Inter',sans-serif;}
.copy-btn:hover{background:rgba(168,85,247,0.15);}
.show-pw-btn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;}

/* FAB */
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:18px;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 8px 24px rgba(124,58,237,0.4);z-index:200;display:flex;align-items:center;justify-content:center;transition:transform 0.2s;}
.fab:hover{transform:scale(1.05);}

/* FORM MODAL */
.form-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.form-modal.open{display:flex;}
.form-sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;}
.form-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.form-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-field{margin-bottom:10px;}
.form-field.full{grid-column:1/-1;}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.form-input{width:100%;background:var(--surface2);border:2px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;font-family:'Inter',sans-serif;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--accent);}
.form-select{width:100%;background:var(--surface2);border:2px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;font-family:'Inter',sans-serif;}
.form-textarea{width:100%;background:var(--surface2);border:2px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;font-family:'Inter',sans-serif;resize:none;height:80px;}
.pw-gen-row{display:flex;gap:8px;align-items:flex-end;}
.btn-gen{background:linear-gradient(135deg,var(--accent3),#0891B2);color:#fff;border:none;border-radius:10px;padding:11px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;}
.form-btns{display:flex;gap:10px;margin-top:8px;}
.btn-save{flex:1;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-del{padding:14px 16px;background:rgba(239,68,68,0.15);border:1px solid #EF4444;color:#EF4444;border-radius:12px;font-size:15px;cursor:pointer;font-family:'Inter',sans-serif;}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}

/* TOAST */
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:999;white-space:nowrap;box-shadow:var(--card-shadow);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* CATEGORY FIELDS */
.cat-fields { margin-top: 0; }
.cat-field-section { background: rgba(124,58,237,0.08); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.cat-field-title { font-size: 11px; font-weight: 700; color: var(--accent2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--muted);}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* CUSTOM CATEGORY MANAGER */
.cat-mgr-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:400;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
.cat-mgr-overlay.open{display:flex;}
.cat-mgr-sheet{background:var(--surface);border-radius:20px;padding:20px;width:100%;max-width:600px;margin:auto;}
.cat-mgr-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.cat-item{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;}
.cat-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cat-item-name{font-size:14px;font-weight:700;color:var(--text);}
.cat-item-actions{display:flex;gap:6px;}
.field-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.field-item{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;}
.field-item span{flex:1;color:var(--muted);}
.btn-add-field{width:100%;padding:8px;background:rgba(124,58,237,0.15);border:1px dashed var(--accent);color:var(--accent);border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-add-cat{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:8px;}
.new-cat-row{display:flex;gap:8px;margin-bottom:12px;}
.new-cat-input{flex:1;background:var(--surface2);border:2px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;font-family:'Inter',sans-serif;}
.new-cat-input:focus{border-color:var(--accent);}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px;}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-logo">
      <div class="lock-logo-icon">🔐</div>
      <h1>SR Password Vault</h1>
      <p>Secure. Private. Always with you.</p>
    </div>

    <div class="user-tabs">
      <button class="user-tab active" onclick="selectUser('admin',this)">👑 Admin</button>
      <button class="user-tab" onclick="selectUser('ramesh',this)">👤 Ramesh</button>
      <button class="user-tab" onclick="selectUser('family',this)">👨‍👩‍👧 Family</button>
    </div>

    <div class="lock-input-wrap">
      <input type="password" class="lock-input" id="masterPw" placeholder="Master Password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="eye-btn" onclick="toggleEye('masterPw',this)">👁️</button>
    </div>
    <div class="lock-error" id="lockError"></div>
    <button class="btn-primary" onclick="doLogin()">🔓 Unlock Vault</button>
    <div class="forgot-link">
      <button onclick="openReset()">Forgot password?</button>
    </div>
  </div>
</div>

<!-- RESET MODAL -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>🔑 Reset Password</h3>
    <div class="modal-error" id="resetError"></div>
    <input type="password" class="modal-input" id="resetCode" placeholder="Secret Reset Code (TEMPLE2026)">
    <input type="password" class="modal-input" id="newPw" placeholder="New Password">
    <input type="password" class="modal-input" id="confirmPw" placeholder="Confirm Password">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeReset()">Cancel</button>
      <button class="btn-confirm" onclick="doReset()">Reset ✓</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div class="app-logo">
      <div class="app-logo-icon">🔐</div>
      <span>SR Vault</span>
    </div>
    <div class="header-right">
      <span class="user-badge" id="userBadge">Admin</span>
      <button class="icon-btn" onclick="openCatManager()" id="catMgrBtn" style="display:none" title="Manage Categories">🏷️</button>
      <button class="icon-btn" onclick="openChangePw()">🔑</button>
      <button class="icon-btn" onclick="doLogout()">🚪</button>
    </div>
  </div>

  <div class="main">
    <!-- SEARCH -->
    <div class="search-wrap">
      <input type="text" class="search-input" id="searchInp" placeholder="🔍 Search entries..." oninput="renderEntries()">
    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="totalCount" style="background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="catCount" style="background:linear-gradient(135deg,var(--accent3),#0891B2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">0</div>
        <div class="stat-label">Categories</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="userCount" style="background:linear-gradient(135deg,var(--accent4),#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">0</div>
        <div class="stat-label">My Entries</div>
      </div>
    </div>

    <!-- CATEGORY FILTER -->
    <div class="cat-scroll" id="catFilter"></div>

    <!-- ENTRIES -->
    <div id="entriesList">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" onclick="openForm()" style="display:none">+</button>

<!-- FORM MODAL -->
<div class="form-modal" id="formModal">
  <div class="form-sheet">
    <div class="form-handle"></div>
    <div class="form-title">
      <span id="formTitle">➕ New Entry</span>
      <button onclick="closeForm()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-field full">
        <label class="form-label">Title / Name *</label>
        <input type="text" class="form-input" id="fName" placeholder="e.g. Gmail, SBI Bank, Facebook">
      </div>
      <div class="form-field">
        <label class="form-label">Category</label>
        <select class="form-select" id="fCat" onchange="showCatFields()">
          <option value="🌐 Web">🌐 Web</option>
          <option value="🏦 Bank">🏦 Bank</option>
          <option value="📱 App">📱 App</option>
          <option value="📧 Email">📧 Email</option>
          <option value="🛒 Shopping">🛒 Shopping</option>
          <option value="📺 Streaming">📺 Streaming</option>
          <option value="💼 Work">💼 Work</option>
          <option value="🏛️ Govt">🏛️ Govt</option>
          <option value="🔧 Other">🔧 Other</option>
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">Owner</label>
        <select class="form-select" id="fOwner">
          <option value="admin">👑 Admin</option>
          <option value="ramesh">👤 Ramesh</option>
          <option value="family">👨‍👩‍👧 Family</option>
          <option value="all">🌐 All</option>
        </select>
      </div>
      <div class="form-field full">
        <label class="form-label">Username / Email</label>
        <input type="text" class="form-input" id="fUser" placeholder="username or email">
      </div>
      <div class="form-field full">
        <label class="form-label">Password</label>
        <div class="pw-gen-row">
          <input type="text" class="form-input" id="fPw" placeholder="password" style="flex:1">
          <button class="btn-gen" onclick="genPassword()">⚡ Generate</button>
        </div>
      </div>
      <div class="form-field full">
        <label class="form-label">URL / Link</label>
        <input type="text" class="form-input" id="fUrl" placeholder="https://...">
      </div>
      <div class="form-field full">
        <label class="form-label">Hint / Notes</label>
        <textarea class="form-textarea" id="fNote" placeholder="Any notes, hints, or reminders..."></textarea>
      </div>
    </div>

    <!-- CATEGORY SPECIFIC FIELDS -->
    <div id="catFields" class="cat-fields"></div>

    <div class="form-btns">
      <button class="btn-del" id="delBtn" onclick="deleteEntry()" style="display:none">🗑️</button>
      <button class="btn-save" onclick="saveEntry()">💾 Save</button>
    </div>
  </div>
</div>

  if (currentCat !== 'All') list = list.filter(e => e.category === currentCat);
  // Search
  const q = document.getElementById('searchInp').value.toLowerCase().trim();
  if (q) list = list.filter(e => e.name.toLowerCase().includes(q) || (e.username||'').toLowerCase().includes(q) || (e.url||'').toLowerCase().includes(q) || (e.note||'').toLowerCase().includes(q));

}

function showCatFields(data) {
  const cat = document.getElementById('fCat').value;
  const container = document.getElementById('catFields');
  const fields = CAT_FIELDS_CONFIG[cat];
  if (!fields || !fields.length) { container.innerHTML = ''; return; }
  
  let html = '<div class="cat-field-section"><div class="cat-field-title">📋 ' + cat + ' Details</div><div class="form-grid">';
  fields.forEach(f => {
    const val = data && data[f.id] ? data[f.id] : '';
    const type = f.type || 'text';
    html += '<div class="form-field full"><label class="form-label">' + f.label + '</label>';
    html += '<input type="' + type + '" class="form-input" id="' + f.id + '" placeholder="' + f.placeholder + '" value="' + (val||'') + '"></div>';
  });
  html += '</div></div>';
  container.innerHTML = html;
}

function getCatFieldsData() {
  const cat = document.getElementById('fCat').value;
  const fields = CAT_FIELDS_CONFIG[cat];
  if (!fields) return {};
  const data = {};
  fields.forEach(f => {
    const el = document.getElementById(f.id);
    if (el && el.value.trim()) data[f.id] = el.value.trim();
  });
  return data;
}

function saveEntry() {
  const name = document.getElementById('fName').value.trim();
  const username = document.getElementById('fUser').value.trim();
  const password = document.getElementById('fPw').value.trim();
  const url = document.getElementById('fUrl').value.trim();
  const note = document.getElementById('fNote').value.trim();
  const category = document.getElementById('fCat').value;
  const owner = document.getElementById('fOwner').value;
  if (!name) { toast('⚠️ Title required!'); return; }
  if (!password) { toast('⚠️ Password required!'); return; }
  const catData = getCatFieldsData();
  const data = { name, username, password, url, note, category, owner, catData, updatedAt: Date.now() };
  if (editId) {
    db.ref('entries/'+editId).update(data).then(() => { closeForm(); toast('✅ Updated!'); });
  } else {
    data.createdAt = Date.now();
    db.ref('entries').push(data).then(() => { closeForm(); toast('✅ Saved!'); });
  }
}

function deleteEntry() {
  if (!editId) return;
  if (!confirm('Delete this entry?')) return;
  db.ref('entries/'+editId).remove().then(() => { closeForm(); toast('🗑️ Deleted!'); });
}

function genPassword() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$%';

  for (let i = 0; i < 12; i++) pw += chars[Math.floor(Math.random() * chars.length)];

  toast('⚡ Password generated!');
}

  if (!label) { document.getElementById('addFieldError').textContent = '⚠️ Label required!'; return; }
  const cat = customCategories[currentAddFieldCatId];
  if (!cat) return;
  const fields = cat.fields || [];
  fields.push({ id: 'f_' + Date.now(), label, type });
  db.ref('customCategories/' + currentAddFieldCatId + '/fields').set(fields).then(() => {
    closeAddField();
    toast('✅ Field added!');
  });
}

function deleteField(catId, fieldIdx) {
  const cat = customCategories[catId];
  if (!cat) return;
  const fields = [...(cat.fields || [])];
  fields.splice(fieldIdx, 1);
  db.ref('customCategories/' + catId + '/fields').set(fields).then(() => toast('🗑️ Field deleted!'));
}

function renderCatManager() {
  const list = document.getElementById('catMgrList');
  if (!list) return;
  const cats = Object.values(customCategories);
  if (!cats.length) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">No custom categories yet. Add one above!</div>';
    return;
  }
  list.innerHTML = cats.map(cat => `
    <div class="cat-item">
      <div class="cat-item-header">
        <span class="cat-item-name">${cat.emoji} ${cat.name}</span>
        <div class="cat-item-actions">
          <button class="action-btn" onclick="openAddField('${cat.id}')">+ Field</button>
          <button class="action-btn danger" onclick="deleteCustomCat('${cat.id}')">🗑️</button>
        </div>
      </div>
      <div class="field-list">
        ${(cat.fields||[]).map((f,i) => `
          <div class="field-item">
            <span>${f.label} <small style="color:var(--accent2)">(${f.type})</small></span>
            <button onclick="deleteField('${cat.id}',${i})" style="background:none;border:none;color:#EF4444;cursor:pointer;font-size:13px;">✕</button>
          </div>`).join('')}
      </div>
      <button class="btn-add-field" onclick="openAddField('${cat.id}')">+ Add Field</button>
    </div>
  `).join('');
}

function updateCategoryDropdowns() {
  const defaultCats = [
    {val:'🌐 Web',label:'🌐 Web'},
    {val:'🏦 Bank',label:'🏦 Bank'},
    {val:'📱 App',label:'📱 App'},
    {val:'📧 Email',label:'📧 Email'},
    {val:'🛒 Shopping',label:'🛒 Shopping'},
    {val:'📺 Streaming',label:'📺 Streaming'},
    {val:'💼 Work',label:'💼 Work'},
    {val:'🏛️ Govt',label:'🏛️ Govt'},
    {val:'🔧 Other',label:'🔧 Other'},
  ];
  const customCats = Object.values(customCategories).map(c => ({val: c.id, label: c.emoji+' '+c.name}));
  const allCats = [...defaultCats, ...customCats];
  const opts = allCats.map(c => `<option value="${c.val}">${c.label}</option>`).join('');
  const fCat = document.getElementById('fCat');
  if (fCat) { const prev=fCat.value; fCat.innerHTML=opts; if(prev)fCat.value=prev; }
}

// Show cat manager button for admin
function updateAdminUI() {
  const btn = document.getElementById('catMgrBtn');
  if (btn) btn.style.display = isAdmin ? 'block' : 'none';
}

// Override showCatFields to handle custom categories
const _origShowCatFields = showCatFields;
function showCatFields(data) {
  const cat = document.getElementById('fCat').value;
  // Check if it's a custom category
  if (customCategories[cat]) {
    const customCat = customCategories[cat];
    const fields = customCat.fields || [];
    const container = document.getElementById('catFields');
    if (!fields.length) { container.innerHTML = ''; return; }
    let html = '<div class="cat-field-section"><div class="cat-field-title">📋 ' + customCat.emoji + ' ' + customCat.name + ' Details</div><div class="form-grid">';
    fields.forEach(f => {
      const val = data && data[f.id] ? data[f.id] : '';
      html += '<div class="form-field full"><label class="form-label">' + f.label + '</label>';
      html += '<input type="' + f.type + '" class="form-input" id="' + f.id + '" placeholder="Enter ' + f.label + '" value="' + (val||'') + '"></div>';
    });
    html += '</div></div>';
    container.innerHTML = html;
    return;
  }
  // Default categories
  _origShowCatFields(data);
}
</script>
</body>
